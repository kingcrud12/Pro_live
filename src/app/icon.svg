    }
  </style>
  <text x="50" y="44" fontFamily="system-ui, -apple-system, sans-serif" fontWeight="900" fontSize="38" fill="#D4AF37" textAnchor="middle">
    PRO
  </text>
  <text x="50" y="80" fontFamily="system-ui, -apple-system, sans-serif" fontWeight="900" fontSize="38" textAnchor="middle">
    <tspan className="live-text">LIVE</tspan>
    <tspan fill="#D4AF37">.</tspan>
  </text>
  <text x="50" y="95" fontFamily="system-ui, -apple-system, sans-serif" fontWeight="bold" fontSize="10" letterSpacing="1.5" fill="#D4AF37" textAnchor="middle">
    - AGENCY -
  </text>
